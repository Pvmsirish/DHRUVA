[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taskman"
version = "1.1.0"
description = "A tiny JSON-backed CLI task manager"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
taskman = "taskman:main"

[tool.setuptools]
py-modules = ["taskman"]
